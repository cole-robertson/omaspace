<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#16161e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-title" content="omaspace">
<title>omaspace</title>
<style>
  /* Omarchy palette: the host's theme/colors.toml arrives as --t-* variables;
     the fallbacks are Tokyo Night (Omarchy's default). */
  /*OMARCHY-THEME*/
  @font-face { font-family:"OmarchyMono"; src:url("/font.ttf") format("truetype"); font-display:swap; }
  :root {
    --bg: var(--t-background, #1a1b26); --panel: var(--t-dark-background, #16161e); --raise: var(--t-lighter-background, #24283b);
    --line: var(--t-selection, #292e42); --fg: var(--t-bright-foreground, #c0caf5); --dim: var(--t-dark-foreground, #565f89);
    --accent: var(--t-accent, #7aa2f7); --agent: var(--t-yellow, #e0af68); --ok: var(--t-green, #9ece6a); --bad: var(--t-red, #f7768e);
    --tap: 44px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--panel); color:var(--fg); font:13px/1.4 "JetBrainsMono Nerd Font", "OmarchyMono", ui-monospace, monospace; }
  body { display:grid; grid-template-rows:auto 1fr auto; height:100dvh; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  /* Home-screen app on iOS: 100dvh stops short of the screen (it leaves the
     area under the home bar), so fill the whole window instead. */
  @media (display-mode: standalone) { html, body { height:100vh; } body { position:fixed; inset:0; height:auto; } }
  /* While the phone keyboard is up, the page is sized to what's left above it
     (--vvh from visualViewport) and pinned, so iOS can't scroll it away. */
  body.kbd-up { position:fixed; inset:0 auto auto 0; width:100%; height:var(--vvh, 100dvh); }
  button, select { font:inherit; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  button:active { background:var(--raise); }

  /* Top: like the Omarchy bar. One row, never wraps: host, workspaces, presence. */
  header { display:flex; align-items:center; gap:6px; padding:calc(4px + var(--safe-t)) 8px 4px; background:var(--panel); border-bottom:1px solid var(--line); min-height:40px; }
  .host { color:var(--accent); font-weight:700; white-space:nowrap; }
  #spaces { display:flex; gap:2px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
  #spaces::-webkit-scrollbar { display:none; }
  .ws { flex:0 0 auto; min-width:28px; height:28px; padding:0 4px; border:0; border-radius:6px; color:var(--dim); position:relative; }
  .ws.has { color:var(--fg); }
  .ws.has::after { content:""; position:absolute; left:50%; bottom:3px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:currentColor; opacity:.6; }
  .ws.on { background:var(--accent); color:var(--panel); }
  .ws.agent { box-shadow: inset 0 -2px 0 var(--agent); }
  .pill { display:flex; align-items:center; gap:4px; padding:2px 8px; border:1px solid var(--line); border-radius:12px; white-space:nowrap; color:var(--dim); height:26px; }
  .pill b { color:var(--fg); font-weight:400; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--dim); }
  .dot.live { background:var(--ok); } .dot.down { background:var(--bad); }

  main { position:relative; overflow:hidden; touch-action:none; background:#000; }
  canvas#screen { position:absolute; left:0; top:0; transform-origin:0 0; background:#000; outline:none; image-rendering:auto; }
  #zoom { position:absolute; right:8px; bottom:8px; display:flex; gap:4px; opacity:.55; transition:opacity .2s; }
  #zoom:hover, #zoom:active { opacity:1; }
  #zoom button { color:var(--fg); background:color-mix(in srgb, var(--panel) 85%, transparent); width:36px; height:36px; backdrop-filter:blur(6px); }
  #cursors { position:absolute; inset:0; pointer-events:none; }
  /* Swipe hint: the workspace you'll land on, at the edge you're swiping toward. */
  #swipe-peek { position:absolute; top:50%; transform:translateY(-50%); display:none; min-width:52px; height:52px; padding:0 10px; border-radius:26px;
    align-items:center; justify-content:center; font-size:22px; background:var(--panel); color:var(--dim); border:1px solid var(--line); pointer-events:none; }
  #swipe-peek.on { display:flex; }
  #swipe-peek.right { right:14px; } #swipe-peek.left { left:14px; }
  #swipe-peek.ready { background:var(--accent); color:var(--panel); border-color:var(--accent); }
  #swipe-peek:empty { display:none; }
  /* Long-press a tile: it lifts. Drag and a snapshot of the window follows
     your finger, the tile under it lights up, and letting go swaps them.
     Let go without dragging and an action sheet comes up from the bottom. */
  .tile { position:absolute; border:2px solid var(--accent); border-radius:10px; pointer-events:none; }
  .tile.lifted { box-shadow:0 0 0 9999px rgba(0,0,0,.45); }
  .tile.lifted.away { border-style:dashed; opacity:.7; }
  .tile.target { border-width:3px; background:color-mix(in srgb, var(--accent) 22%, transparent); transition:all .12s ease-out; }
  #ghost { position:absolute; display:none; pointer-events:none; border-radius:10px; overflow:hidden; border:2px solid var(--accent);
    box-shadow:0 18px 50px rgba(0,0,0,.6); transform-origin:center; will-change:transform; }
  #ghost.on { display:block; }
  #ghost canvas { display:block; width:100%; height:100%; }
  #ghost.settle { transition:transform .18s ease-out, opacity .18s ease-out; }
  #tile-sheet { position:fixed; left:0; right:0; bottom:0; z-index:20; display:none; background:var(--panel); border-top:1px solid var(--line);
    border-radius:16px 16px 0 0; padding:8px 12px calc(14px + var(--safe-b)); box-shadow:0 -10px 40px rgba(0,0,0,.5); transform:translateY(100%); transition:transform .18s ease-out; }
  #tile-sheet.on { display:block; }
  #tile-sheet.up { transform:none; }
  #tile-sheet .ttl { padding:4px 4px 10px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #tile-sheet .ttl b { color:var(--fg); font-weight:400; }
  #tile-sheet .row { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:8px; }
  #tile-sheet button { height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:12px; border-radius:12px; background:var(--raise); border-color:transparent; }
  #tile-sheet button .i { font-size:20px; }
  #tile-sheet button.wide { width:100%; flex-direction:row; gap:8px; font-size:15px; }
  #tile-sheet button.danger { background:color-mix(in srgb, var(--bad) 16%, var(--panel)); color:var(--bad); }
  #tile-sheet .ws-row { display:grid; grid-template-columns:repeat(9, 1fr); gap:4px; margin-bottom:10px; }
  #tile-sheet .ws-row button { height:44px; font-size:15px; padding:0; }
  #tile-hand button { margin-bottom:8px; }
  #tile-sheet .lbl2 { color:var(--dim); font-size:11px; margin:2px 4px 6px; }
  #tile-hint { position:absolute; left:50%; top:10px; transform:translateX(-50%); display:none; padding:6px 12px; border-radius:16px; background:var(--panel); border:1px solid var(--line); pointer-events:none; white-space:nowrap; z-index:5; }
  #tile-hint.on { display:block; }
  /* Arrow pad: tap an edge for one arrow; hold and slide to repeat, faster
     the further you slide (shell history, moving through a line). */
  #arrows { position:relative; min-width:56px; padding:0; touch-action:none; }
  #arrows .pad { position:relative; width:40px; height:34px; display:block; }
  #arrows .pad i { position:absolute; font-style:normal; font-size:9px; line-height:1; color:var(--dim); }
  #arrows .pad .u { left:50%; top:1px; transform:translateX(-50%); } #arrows .pad .d { left:50%; bottom:1px; transform:translateX(-50%); }
  #arrows .pad .l { left:2px; top:50%; transform:translateY(-50%); } #arrows .pad .r { right:2px; top:50%; transform:translateY(-50%); }
  #arrows .pad i.on { color:var(--accent); }
  #arrows.active { background:var(--raise); border-color:var(--accent); }
  /* Agent spaces: their workspace in the strip wears the agent's initial;
     yellow while working, red when it needs you. On its workspace a bar
     says who it is and what it's doing. */
  .ws.agent { box-shadow:none; color:var(--agent); }
  .ws .who { position:absolute; right:1px; top:0; font-size:9px; line-height:1; padding:1px 2px; border-radius:3px; background:var(--agent); color:var(--panel); }
  .ws.needs .who { background:var(--bad); animation:pulse 1.2s ease-in-out infinite; }
  .ws.on.agent { color:var(--panel); }
  @keyframes pulse { 50% { opacity:.4; } }
  #agent-bar { touch-action:manipulation; position:absolute; left:8px; right:8px; top:8px; z-index:4; display:none; align-items:center; gap:8px; padding:8px 12px; border-radius:12px;
    background:color-mix(in srgb, var(--panel) 88%, transparent); border:1px solid var(--agent); backdrop-filter:blur(6px); cursor:pointer; }
  #agent-bar.on { display:flex; }
  /* The help banner (with Take over) must stay tappable: below the agent bar. */
  #agent-bar.on ~ #banner, #banner.on { z-index:6; }
  body:has(#agent-bar.on) #banner { top:64px; }
  #agent-bar.needs { border-color:var(--bad); }
  #agent-bar .n { color:var(--agent); font-weight:700; white-space:nowrap; }
  #agent-bar.needs .n { color:var(--bad); }
  #agent-bar .s { color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  #agent-sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; display:none; background:var(--panel); border-top:1px solid var(--line);
    border-radius:16px 16px 0 0; padding:8px 12px calc(14px + var(--safe-b)); box-shadow:0 -10px 40px rgba(0,0,0,.5); transform:translateY(100%); transition:transform .18s ease-out; }
  #agent-sheet.on { display:block; } #agent-sheet.up { transform:none; }
  #agent-sheet .ttl { padding:4px; color:var(--dim); } #agent-sheet .ttl b { color:var(--agent); font-weight:700; }
  #agent-sheet .task { padding:2px 4px 6px; } #agent-sheet .st { padding:0 4px 10px; color:var(--dim); }
  #agent-sheet button.wide { width:100%; height:52px; margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; border-radius:12px; background:var(--raise); border-color:transparent; }
  #agent-sheet button.done { background:color-mix(in srgb, var(--ok) 18%, var(--panel)); color:var(--ok); }
  /* Machine switcher: tap the host name (or the ⇄ on phones). */
  #host { cursor:pointer; display:flex; align-items:center; gap:4px; }
  #host::after { content:"\25BE"; color:var(--dim); font-size:10px; }
  #machines-btn { display:none; }
  #machines { position:absolute; left:8px; top:8px; width:min(340px, calc(100% - 16px)); display:none; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px; z-index:12; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #machines.on { display:block; }
  #machines .m { display:flex; align-items:center; gap:10px; width:100%; padding:10px; border:1px solid transparent; border-radius:10px; text-align:left; margin-bottom:4px; background:var(--raise); }
  #machines .m.here { border-color:var(--accent); }
  #machines .m .n { font-weight:700; }
  #machines .m .d { color:var(--dim); font-size:11px; }
  #machines .m .who { margin-left:auto; display:flex; gap:6px; align-items:center; color:var(--dim); font-size:12px; }
  #machines .m .who .ag { color:var(--agent); }
  #machines .m[disabled] { opacity:.5; }
  #machines .head { color:var(--dim); padding:2px 4px 8px; }
  /* Hold to talk: a level meter while recording, then "transcribing…". */
  #mic-btn.rec { background:var(--bad); color:var(--panel); border-color:var(--bad); }
  #mic-btn.busy { opacity:.6; }
  #talk { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:none; align-items:center; gap:10px; padding:10px 16px;
    border-radius:22px; background:var(--panel); border:1px solid var(--line); pointer-events:none; white-space:nowrap; max-width:92%; }
  #talk.on { display:flex; }
  #talk .bars { display:flex; gap:3px; align-items:center; height:22px; }
  #talk .bars i { width:4px; border-radius:2px; background:var(--bad); height:4px; transition:height .08s; }
  #talk .txt { overflow:hidden; text-overflow:ellipsis; }
  .cursor { position:absolute; transform:translate(-2px,-2px); transition:left .06s linear, top .06s linear; }
  .cursor svg { width:18px; height:18px; display:block; }
  .cursor span { position:absolute; left:16px; top:14px; font-size:11px; padding:1px 5px; border-radius:4px; background:var(--accent); color:var(--panel); white-space:nowrap; }
  .cursor.agent span { background:var(--agent); }
  #banner { position:absolute; top:10px; left:50%; transform:translateX(-50%); display:none; gap:8px; align-items:center; padding:8px 12px; border:1px solid var(--agent); background:var(--panel); border-radius:8px; max-width:92%; }
  #banner.on { display:flex; }
  #banner button, aside button, #files button { padding:6px 10px; }
  #banner button.primary { border-color:var(--agent); color:var(--agent); }

  /* Sheets: Windows and Files slide up from the dock on phones, sit at the side on laptops. */
  aside, #files { position:absolute; right:8px; top:8px; bottom:8px; width:min(360px,90vw); background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:auto; display:none; padding:8px; -webkit-user-select:text; user-select:text; }
  #files { left:8px; right:auto; }
  aside.on, #files.on { display:block; }
  .win { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:6px; }
  .win.focused { border-color:var(--accent); }
  .win .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .win .c { color:var(--dim); font-size:11px; }
  .win .row1 { display:flex; flex-direction:column; gap:6px; }
  .win .tt { cursor:pointer; min-width:0; }
  .win .acts { display:flex; gap:4px; flex-wrap:wrap; }
  .win .acts button, .win .acts select { height:32px; padding:0 8px; font-size:12px; }
  .win .acts button.danger { color:var(--bad); }
  .grab { display:none; width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 8px; }
  .group { color:var(--dim); margin:10px 2px 4px; }
  #files .row { display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); }
  #files .row .n { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #files .row .s { color:var(--dim); font-size:11px; }
  #files a { color:var(--accent); text-decoration:none; }
  #files .head { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .spacer { flex:1; }

  /* Bottom dock: the keys you can't type on a phone, then Omarchy actions. */
  footer { display:flex; gap:6px; padding:6px 8px calc(6px + var(--safe-b)); background:var(--panel); border-top:1px solid var(--line); align-items:center; }
  .keys, .acts-bar { display:flex; gap:4px; }
  .acts-bar { overflow-x:auto; scrollbar-width:none; flex:1; min-width:0; }
  .acts-bar::-webkit-scrollbar { display:none; }
  footer button { flex:0 0 auto; height:36px; min-width:36px; padding:0 10px; display:flex; align-items:center; justify-content:center; gap:4px; white-space:nowrap; }
  footer button .i { font-size:16px; line-height:1; }
  footer button.held, #kbd-btn.up { background:var(--accent); color:var(--panel); border-color:var(--accent); }
  .sep { width:1px; align-self:stretch; background:var(--line); margin:4px 2px; }
  #more-btn { display:none; }
  #more-btn.on { background:var(--accent); color:var(--panel); border-color:var(--accent); }
  /* Off-screen input that catches the phone keyboard: fixed at the top-left so
     focusing it never makes iOS scroll the page to bring it into view. */
  #kbd { position:fixed; top:0; left:0; opacity:0; width:1px; height:1px; font-size:16px; pointer-events:none; }
  #status { display:none; }
  #toasts { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; flex-direction:column; gap:4px; pointer-events:none; }
  .toast { background:var(--panel); border:1px solid var(--accent); border-radius:6px; padding:6px 12px; white-space:nowrap; }
  #drop { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:color-mix(in srgb, var(--accent) 18%, transparent); border:2px dashed var(--accent); font-size:18px; pointer-events:none; }
  #drop.on { display:flex; }

  /* Phones: bigger tap targets, icon-only dock, sheets from the bottom. */
  @media (max-width: 600px) {
    #stats, .lbl, .host { display:none; }
    #machines-btn { display:flex; }
    /* The dock keeps the keys; Omarchy actions live in a sheet above it. */
    #more-btn { display:flex; margin-left:auto; }
    /* Phones dictate with the keyboard's own mic (Apple/Google speech); the
       hold-to-talk button (voxtype on the machine) stays for laptops. */
    #mic-btn { display:none; }
    .sep { display:none; }
    .acts-bar { display:none; position:fixed; left:8px; right:8px; bottom:calc(var(--tap) + 20px + var(--safe-b)); z-index:5;
      grid-template-columns:repeat(3, 1fr); gap:8px; padding:10px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
      box-shadow:0 10px 40px rgba(0,0,0,.5); }
    .acts-bar.on { display:grid; }
    .acts-bar button { height:64px; flex-direction:column; gap:6px; font-size:12px; }
    .acts-bar button .i { font-size:22px; }
    .acts-bar .lbl { display:inline; }
    .ws { min-width:32px; height:32px; }
    footer button { height:var(--tap); min-width:var(--tap); padding:0 8px; }
    .keys button { min-width:46px; font-size:12px; }
    aside, #files { left:0; right:0; top:auto; bottom:0; width:auto; max-height:70%; border-radius:14px 14px 0 0; border-bottom:0; padding:8px 12px calc(12px + var(--safe-b)); }
    .grab { display:block; }
  }
</style>
</head>
<body>
<header id="top">
  <span class="host" id="host" title="Your machines">omaspace</span>
  <span id="spaces"></span>
  <span class="pill" id="people" role="button" title="Your machines"></span>
  <span class="pill" id="stats"></span>
</header>
<main id="stage">
  <canvas id="screen" tabindex="0"></canvas>
  <div id="zoom"><button id="zoom-out" title="Zoom out">−</button><button id="zoom-fit" title="Fit / readable">⤢</button><button id="zoom-in" title="Zoom in">+</button></div>
  <div id="cursors"></div>
  <div id="swipe-peek"></div>
  <div id="tiles"></div>
  <div id="ghost"><canvas></canvas></div>
  <div id="agent-bar"><span class="i">󰚩</span><span class="n"></span><span class="s"></span></div>
  <div id="machines"><div class="head">Your machines</div><div id="machines-list"></div></div>
  <div id="tile-hint"></div>
  <div id="banner"><span id="banner-text"></span><button class="primary" id="takeover">Take over</button><button id="dismiss">Later</button></div>
  <aside id="panel"></aside>
  <div id="files"><div class="head"><b id="files-path">~/Downloads</b><span class="spacer"></span><button id="upload-btn">Upload</button><button id="files-close">✕</button></div><div id="files-list"></div></div>
  <div id="drop">Drop to send to this machine's Downloads</div>
  <div id="toasts"></div>
  <div id="talk"><span class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="txt"></span></div>
  <input type="file" id="file-input" multiple hidden>
</main>
<div id="agent-sheet">
  <div class="grab" style="display:block"></div>
  <div class="ttl"></div><div class="task"></div><div class="st"></div>
  <button class="wide watch"><span class="i">󰛐</span>Watch</button>
  <button class="wide done"><span class="i">󰄬</span>Done, hand back to the agent</button>
  <div class="browsers"></div>
</div>
<div id="tile-sheet">
  <div class="grab" style="display:block"></div>
  <div class="ttl" id="tile-title"></div>
  <div class="row">
    <button id="tile-full"><span class="i">󰊓</span>Fullscreen</button>
    <button id="tile-float"><span class="i">󰖯</span><span id="tile-float-l">Float</span></button>
    <button id="tile-menu"><span class="i">󰍜</span>Right-click</button>
  </div>
  <div class="lbl2">Move to workspace</div>
  <div class="ws-row" id="tile-ws"></div>
  <div id="tile-hand"></div>
  <button id="tile-close" class="wide danger"><span class="i">󰅖</span>Close window</button>
</div>
<footer>
  <div class="keys">
    <button data-mod="64" title="Hold SUPER for the next key"><span class="i">󰘳</span><span class="lbl">SUPER</span></button>
    <button data-mod="1" title="Shift">⇧<span class="lbl"> SHIFT</span></button>
    <button data-mod="4" title="Ctrl">ctrl</button>
    <button data-mod="8" title="Alt">alt</button>
    <button id="kbd-btn" title="Keyboard"><span class="i">󰌌</span></button>
    <button id="arrows" title="Arrows: tap an edge, or hold and slide to keep pressing (like a terminal's cursor keys)"><span class="pad"><i class="u">▲</i><i class="l">◀</i><i class="r">▶</i><i class="d">▼</i></span></button>
    <button id="mic-btn" title="Hold to talk: types what you say into the focused window"><span class="i">󰍬</span></button>
  </div>
  <span class="sep"></span>
  <button id="more-btn" title="Omarchy"><span class="i">󰣇</span></button>
  <div class="acts-bar" id="acts">
    <button data-omarchy="menu" title="Omarchy menu"><span class="i">󰣇</span><span class="lbl">Menu</span></button>
    <button data-omarchy="launcher" title="Apps"><span class="i">󰀻</span><span class="lbl">Apps</span></button>
    <button data-omarchy="terminal" title="Terminal"><span class="i"></span><span class="lbl">Terminal</span></button>

// ---- arrow pad ------------------------------------------------------------
// Tap: one arrow toward the side you tapped. Hold and slide: the arrow in
// the direction you slid repeats while you hold, faster the further you go
// (like dragging a trackpad cursor through shell history). It only lives on
// this button, so it never competes with swipes or tile drags on the stream.
(() => {
  const pad = $("arrows"), marks = { ArrowUp: ".u", ArrowDown: ".d", ArrowLeft: ".l", ArrowRight: ".r" };
  let start = null, dir = null, timer = 0, sent = 0;
  const press = code => { send({ type: "combo", code, mods: heldMods }); sent++; if (heldMods) clearMods(); };
  const show = code => pad.querySelectorAll(".pad i").forEach(i => i.classList.toggle("on", !!code && i.matches(marks[code])));
  const dirOf = (dx, dy) => Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "ArrowRight" : "ArrowLeft") : (dy > 0 ? "ArrowDown" : "ArrowUp");
  function tick() {
    if (!start || !dir) return;
    press(dir);
    // 20px slide: ~4/s; 80px+: ~16/s.
    const dist = Math.hypot(start.dx, start.dy);
    timer = setTimeout(tick, Math.max(60, 260 - dist * 2.6));
  }
  pad.addEventListener("pointerdown", e => {
    e.preventDefault(); pad.setPointerCapture(e.pointerId);
    const r = pad.getBoundingClientRect();
    start = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
    dir = null; sent = 0; pad.classList.add("active");
  });
  pad.addEventListener("pointermove", e => {
    if (!start) return;
    start.dx = e.clientX - start.x; start.dy = e.clientY - start.y;
    if (Math.hypot(start.dx, start.dy) < 14) return;
    const d = dirOf(start.dx, start.dy);
    if (d !== dir) { dir = d; show(d); clearTimeout(timer); tick(); }
  });
  const end = () => {
    if (!start) return;
    clearTimeout(timer);
    // A tap (no slide): the arrow toward where on the pad you pressed.
    if (!dir && sent === 0) { const code = dirOf(start.x - start.cx, (start.y - start.cy) * 1.2); show(code); press(code); setTimeout(() => show(null), 120); }
    else show(null);
    start = null; dir = null; pad.classList.remove("active");
  };
  pad.addEventListener("pointerup", end);
  pad.addEventListener("pointercancel", end);
  pad.addEventListener("contextmenu", e => e.preventDefault());
})();

// ---- machine switcher: every machine on your tailnet with a live view -----
// Each one is asked who's there (people watching, agents working); tap one to
// watch it. Machines without a live view (or offline) are greyed out.
async function openMachines() {
  const panel = $("machines"), list = $("machines-list");
  if (panel.classList.toggle("on") === false) return;
  list.innerHTML = '<div class="d" style="padding:8px">Looking…</div>';
  let machines = [];
  try { machines = (await (await fetch("/v1/view/machines")).json()).machines; } catch { }
  list.innerHTML = "";
  for (const m of machines) {
    const b = document.createElement("button");
    b.className = "m" + (m.here ? " here" : ""); b.dataset.name = m.name;
    b.innerHTML = `<span class="i" style="font-size:20px">\u{f0379}</span><span><div class="n"></div><div class="d">${m.here ? "watching now" : "checking…"}</div></span><span class="who"></span>`;
    b.querySelector(".n").textContent = m.name;
    b.onclick = () => { if (!m.here) location.href = m.url + location.search; else panel.classList.remove("on"); };
    list.append(b);
    // Ask the machine itself (its view answers presence for anyone on the tailnet you trust).
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2500);
    fetch(m.url + "v1/view/presence", { signal: ctl.signal }).then(r => r.json()).then(p => {
      b.querySelector(".d").textContent = m.here ? "watching now" : "live view";
      b.querySelector(".who").innerHTML = (p.agents.length ? `<span class="ag">\u{f06a9} ${p.agents.length}</span>` : "") + `<span>\u{f06d0} ${p.watching}</span>`;
      b.querySelector(".who").title = p.agents.length ? `agents: ${p.agents.join(", ")}` : "";
      if (p.help) b.querySelector(".d").textContent = "agent needs you: " + p.help;
    }).catch(() => { if (!m.here) { b.disabled = true; b.querySelector(".d").textContent = "live view not published yet"; } });
  }
}
$("host").onclick = openMachines;
$("people").onclick = openMachines;

// ---- hold to talk -------------------------------------------------------------
// Hold the mic, speak, let go: the clip (16 kHz mono WAV) goes to this
// machine, Omarchy's dictation (voxtype, local Whisper) turns it into text,
// and the text is typed into the focused window like the phone keyboard.
const mic = { stream: null, ctx: null, node: null, chunks: [], rate: 16000, started: 0, raf: 0 };
const talk = $("talk"), talkTxt = talk.querySelector(".txt"), bars = [...talk.querySelectorAll(".bars i")];
async function micStart() {
  if (mic.node) return;
  try {
    mic.stream = mic.stream || await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) { toast("✕ microphone: " + e.message, 4000); return; }
  mic.ctx = new AudioContext();
  const src = mic.ctx.createMediaStreamSource(mic.stream);
  // ScriptProcessor is old but everywhere (iOS Safari included); 4096 frames.
  mic.node = mic.ctx.createScriptProcessor(4096, 1, 1);
  mic.chunks = [];
  mic.node.onaudioprocess = e => {
    const data = e.inputBuffer.getChannelData(0);
    mic.chunks.push(new Float32Array(data));
    let peak = 0; for (let i = 0; i < data.length; i += 64) peak = Math.max(peak, Math.abs(data[i]));
    bars.forEach((b, i) => b.style.height = Math.max(4, Math.min(22, peak * 60 * (0.6 + Math.sin(i * 1.7 + performance.now() / 90) * 0.4))) + "px");
  };
  src.connect(mic.node); mic.node.connect(mic.ctx.destination);
  mic.started = performance.now();
  $("mic-btn").classList.add("rec");
  talkTxt.textContent = "listening…"; talk.classList.add("on");
  navigator.vibrate?.(10);
}
async function micStop(cancel) {
  if (!mic.node) return;
  mic.node.disconnect(); mic.node.onaudioprocess = null; mic.node = null;
  const rate = mic.ctx.sampleRate; mic.ctx.close(); mic.ctx = null;
  $("mic-btn").classList.remove("rec");
  const ms = performance.now() - mic.started;
  if (cancel || ms < 300) { talk.classList.remove("on"); return; }
  talkTxt.textContent = "transcribing…"; bars.forEach(b => b.style.height = "4px");
  $("mic-btn").classList.add("busy");
  try {
    const wav = encodeWav(downsample(mic.chunks, rate, 16000), 16000);
    const r = await fetch("/v1/view/dictate", { method: "POST", headers: { "content-type": "audio/wav" }, body: wav });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    const text = (j.text || "").trim();
    if (!text) { talkTxt.textContent = "didn't catch that"; setTimeout(() => talk.classList.remove("on"), 1200); return; }
    talkTxt.textContent = text;
    typeText(text + " ");
    setTimeout(() => talk.classList.remove("on"), 1500);
  } catch (e) {
    talk.classList.remove("on"); toast("✕ dictation: " + e.message, 5000);
  } finally { $("mic-btn").classList.remove("busy"); }
}
/** Type text into the focused window, as the phone keyboard does. */
function typeText(text) {
  for (const ch of text) { const k = US[ch]; if (k) send({ type: "combo", code: k[0], mods: k[1] ? 1 : 0 }); }
}
function downsample(chunks, from, to) {
  const len = chunks.reduce((n, c) => n + c.length, 0), all = new Float32Array(len);
  let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  if (from === to) return all;
  const ratio = from / to, out = new Float32Array(Math.floor(len / ratio));
  // Average each window: a cheap low-pass so 48 kHz → 16 kHz doesn't alias.
  for (let i = 0; i < out.length; i++) {
    const a = Math.floor(i * ratio), b = Math.min(len, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = a; j < b; j++) sum += all[j];
    out[i] = sum / Math.max(1, b - a);
  }
  return out;
}
function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, samples[i])) * 0x7fff, true);
  return buf;
}
const micBtn = $("mic-btn");
micBtn.addEventListener("pointerdown", e => { e.preventDefault(); micBtn.setPointerCapture(e.pointerId); micStart(); });
micBtn.addEventListener("pointerup", () => micStop(false));
micBtn.addEventListener("pointercancel", () => micStop(true));
micBtn.addEventListener("contextmenu", e => e.preventDefault());

if (!("VideoDecoder" in window)) $("status").textContent = "this browser has no WebCodecs (needs HTTPS and a modern browser)";
else connect();
</script>
