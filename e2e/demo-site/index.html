<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Credit Union · Sign in</title>
<style>
  :root { --brand:#0b5d4b; --brand2:#12876c; --ink:#14201d; --muted:#5d6b67; --line:#d9e2df; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:#eef3f1; min-height:100vh; display:flex; flex-direction:column; }
  header { background:var(--brand); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px; }
  header .mark { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#fff 0 45%,#9fe3cf 45%); }
  main { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:36px 16px; }
  .card { width:100%; max-width:400px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:26px 24px; box-shadow:0 8px 30px rgba(10,40,30,.08); }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:15px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:9px; outline:none; }
  input:focus { border-color:var(--brand2); box-shadow:0 0 0 3px rgba(18,135,108,.15); }
  input.code { font-size:28px; letter-spacing:12px; text-align:center; font-variant-numeric:tabular-nums; }
  button { width:100%; margin-top:20px; font:inherit; font-weight:700; color:#fff; background:var(--brand2); border:0; border-radius:9px; padding:12px; cursor:pointer; }
  .hint { display:flex; gap:10px; align-items:flex-start; background:#f2f8f6; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; color:var(--muted); margin-bottom:6px; }
  .hint b { color:var(--ink); }
  .step { display:none; } .step.on { display:block; }
  .ok { text-align:center; } .ok .tick { width:58px; height:58px; margin:4px auto 12px; border-radius:50%; background:#e3f5ee; color:var(--brand2); font-size:32px; line-height:58px; }
  .acct { display:flex; justify-content:space-between; padding:12px 0; border-top:1px solid var(--line); font-size:15px; }
  .acct:first-of-type { margin-top:14px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:14px; }
</style>
</head>
<body>
<header><span class="mark"></span>Harbor Credit Union</header>
<main>
  <div class="card">
    <section class="step on" id="login">
      <h1>Sign in</h1>
      <p class="sub">Online banking</p>
      <form id="login-form">
        <label for="user">Username</label>
        <input id="user" autocomplete="off">
        <label for="pass">Password</label>
        <input id="pass" type="password" autocomplete="off">
        <button type="submit">Continue</button>
      </form>
    </section>
    <section class="step" id="twofa">
      <h1>Verify it's you</h1>
      <p class="sub">We sent a 6-digit code to your phone ending in ··42.</p>
      <div class="hint">📱 <span>Enter the code from your text messages. <b>It expires in 5 minutes.</b></span></div>
      <form id="code-form">
        <label for="code">Verification code</label>
        <input id="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <button type="submit">Verify</button>
      </form>
    </section>
    <section class="step" id="done">
      <div class="ok"><div class="tick">✓</div><h1>Signed in</h1><p class="sub">Welcome back.</p></div>
      <div class="acct"><span>Everyday checking</span><b>$2,418.06</b></div>
      <div class="acct"><span>Savings</span><b>$9,730.00</b></div>
    </section>
  </div>
</main>
<footer>Demo page for omaspace · not a real bank</footer>
<script>
  const show = id => { for (const s of document.querySelectorAll(".step")) s.classList.toggle("on", s.id === id); document.title = { login: "Harbor Credit Union · Sign in", twofa: "Harbor Credit Union · Verify", done: "Harbor Credit Union · Accounts" }[id]; };
  document.getElementById("login-form").onsubmit = e => { e.preventDefault(); show("twofa"); setTimeout(() => document.getElementById("code").focus(), 50); };
  document.getElementById("code-form").onsubmit = e => { e.preventDefault(); if (document.getElementById("code").value.length === 6) show("done"); };
  document.getElementById("code").addEventListener("input", e => { if (e.target.value.length === 6) setTimeout(() => document.getElementById("code-form").requestSubmit(), 350); });
</script>
</body>
</html>
